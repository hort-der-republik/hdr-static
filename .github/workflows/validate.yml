name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANT_OPTS: -Xmx6g
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: set up uv (Python)
        uses: astral-sh/setup-uv@v8.1.0
      - name: set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # fast checks first, so a typo fails within a minute
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint:check
      - name: Check types
        run: pnpm types:check

      - name: Fetch the data
        run: ./fetch_data.sh
      - name: Build the pages
        run: ant
      - name: Build CSS and JS
        run: pnpm build
